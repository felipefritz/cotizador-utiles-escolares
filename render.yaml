services:
  - type: web
    name: cotizador-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://preciofast.cl
      - key: BACKEND_URL
        value: https://cotizador-utiles-escolares.onrender.com
      - key: GOOGLE_REDIRECT_URI
        value: https://cotizador-utiles-escolares.onrender.com/api/auth/google/callback
    healthCheckPath: /health
    autoDeploy: true
